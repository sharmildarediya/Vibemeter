<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VibeMeter Dashboard</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="wrap"><header><a class="brand" href="/">Vibe<span>Meter</span> ✦</a><span class="pill">🔒 Private dashboard</span></header><main><section class="card"><h1 id="title">Responses</h1><p class="muted">💌 People who completed your quiz.</p><div class="stats"><div><b id="count">0</b><span>👥 Responses</span></div><div><b id="avg">—</b><span>📊 Average</span></div><div><b id="top">—</b><span>🏆 Top score</span></div></div><div id="status" class="muted">Loading responses…</div><div id="list"></div></section></main></div>
<script>
const id=location.pathname.split('/').pop();const titleEl=document.getElementById('title'),countEl=document.getElementById('count'),avgEl=document.getElementById('avg'),topEl=document.getElementById('top'),listEl=document.getElementById('list'),statusEl=document.getElementById('status');
async function load(){try{const r=await fetch('/api/quizzes/'+encodeURIComponent(id)+'/responses',{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Dashboard not found.');titleEl.textContent=d.quiz.title;countEl.textContent=d.stats.count;avgEl.textContent=d.stats.average==null?'—':d.stats.average+'%';topEl.textContent=d.stats.top==null?'—':d.stats.top+'%';statusEl.textContent=d.responses.length?'🔄 Updates automatically every 10 seconds.':'💌 No one has answered yet. Share your quiz link.';listEl.innerHTML=d.responses.length?d.responses.map(x=>'<article class="response"><div class="resphead"><div><h3>👤 '+esc(x.name)+'</h3><small>'+new Date(x.created_at).toLocaleString()+'</small></div><strong>'+x.score+'%</strong></div><div>'+x.answers.map((a,i)=>'<div class="ans"><b>Q'+(i+1)+'. '+esc(a.question)+'</b><span>'+ (a.isCorrect?'✅ ':'❌ ')+esc(a.answer)+'<br><small>Correct: '+esc(a.correct)+'</small></span></div>').join('')+'</div></article>').join(''):'<p class="muted">💗 Waiting for the first response…</p>';}catch(e){statusEl.textContent='❌ '+e.message;listEl.innerHTML='<button class="btn pink" onclick="load()">Retry ↻</button>';}}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}load();setInterval(load,10000);
</script></body></html>
