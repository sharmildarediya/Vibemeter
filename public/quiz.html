<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VibeMeter Quiz</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="wrap"><header><a class="brand" href="/">Vibe<span>Meter</span> ✦</a></header><main><div class="quiz card"><div class="pill">💗 VibeMeter</div><h1 id="title">Loading…</h1><p class="muted">💭 Answer honestly 👀</p><label>Your name<input id="name" placeholder="Enter your name" autocomplete="name"></label><div class="bar"><i id="bar"></i></div><div id="box"></div><button id="next" class="btn pink full" type="button">Next →</button></div></main></div>
<script>
const quizId=location.pathname.split('/').pop();
const titleEl=document.getElementById('title'),nameEl=document.getElementById('name'),barEl=document.getElementById('bar'),boxEl=document.getElementById('box'),nextEl=document.getElementById('next');
let quiz=null,idx=0,answers=[];
async function load(){try{const r=await fetch('/api/quizzes/'+encodeURIComponent(quizId),{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Quiz not found.');quiz=d;titleEl.textContent=d.title;render();}catch(e){boxEl.innerHTML='<h2>😕 Quiz could not be loaded</h2><p class="muted">'+esc(e.message)+'</p>';nextEl.remove();}}
function render(){const q=quiz.questions[idx];barEl.style.width=((idx+1)/quiz.questions.length*100)+'%';boxEl.innerHTML='<div class="qtext">'+esc(q.text)+'</div>'+q.options.map((o,i)=>'<button type="button" class="answer '+(answers[idx]===i?'selected':'')+'" onclick="pick('+i+')">'+esc(o)+'</button>').join('');nextEl.textContent=idx===quiz.questions.length-1?'Submit quiz ✨':'Next →';}
function pick(i){answers[idx]=i;render();}
nextEl.addEventListener('click',submitOrNext);
async function submitOrNext(){if(!quiz)return;if(answers[idx]===undefined){alert('Choose an option first 👀');return;}if(idx<quiz.questions.length-1){idx++;render();window.scrollTo({top:0,behavior:'smooth'});return;}if(!nameEl.value.trim()){alert('Enter your name first 💗');nameEl.focus();return;}nextEl.disabled=true;nextEl.textContent='Submitting… 💌';try{const r=await fetch('/api/quizzes/'+encodeURIComponent(quizId)+'/responses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({respondent_name:nameEl.value.trim(),answers})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not submit quiz.');showResult(d);}catch(e){alert('❌ '+e.message);nextEl.disabled=false;nextEl.textContent='Submit quiz ✨';}}
function showResult(d){const correctCount=d.correctCount ?? d.review.filter(x=>x.isCorrect).length;boxEl.innerHTML='<div class="done"><div style="font-size:55px">🎉</div><h2>Thanks, '+esc(nameEl.value.trim())+'! 💗</h2><h3>You got <b>'+correctCount+' / '+quiz.questions.length+'</b> correct</h3><p>Your score: <b>'+d.score+'%</b> ✨</p><div style="text-align:left;margin-top:25px">'+d.review.map((x,i)=>'<div class="response"><b>Q'+(i+1)+'. '+esc(x.question)+'</b><br><span>💬 Your answer: '+esc(x.selected)+'</span><br><span>✅ Correct answer: <b>'+esc(x.correct)+'</b></span><br><span>'+ (x.isCorrect?'💚 Correct!':'💔 Incorrect')+'</span></div>').join('')+'</div><p class="muted">💌 Your answers have been recorded.</p></div>';nextEl.remove();window.scrollTo({top:0,behavior:'smooth'});}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
load();
</script></body></html>
