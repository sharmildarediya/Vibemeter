<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VibeMeter Quiz</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="wrap"><header><a class="brand" href="/">Vibe<span>Meter</span> ✦</a></header><main><div class="quiz card"><div class="pill">💗 VibeMeter</div><h1 id="title"></h1><p class="muted">Answer honestly 👀</p><label>Your name<input id="name" placeholder="Enter your name"></label><div class="bar"><i id="bar"></i></div><div id="box"></div><button id="next" class="btn pink full">Next →</button></div></main></div>
<script>
const id=location.pathname.split("/").pop();let quiz,idx=0,answers=[];
async function load(){const r=await fetch("/api/quizzes/"+id);if(!r.ok){box.innerHTML="<h2>Quiz not found.</h2>";next.remove();return}quiz=await r.json();title.textContent=quiz.title;render()}
function render(){const q=quiz.questions[idx];bar.style.width=((idx+1)/quiz.questions.length*100)+"%";box.innerHTML=`<div class="qtext">${esc(q.text)}</div>`+q.options.map((o,i)=>`<button class="answer ${answers[idx]===i?"selected":""}" onclick="pick(${i})">${esc(o)}</button>`).join("");next.textContent=idx===quiz.questions.length-1?"Submit quiz ✨":"Next →"}
function pick(i){answers[idx]=i;render()}
next.onclick=async()=>{if(answers[idx]===undefined)return alert("Choose an option first 👀");if(idx<quiz.questions.length-1){idx++;render();return}if(!name.value.trim())return alert("Enter your name first.");const r=await fetch("/api/quizzes/"+id+"/responses",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({respondent_name:name.value.trim(),answers})});const d=await r.json();if(!r.ok)return alert(d.error);box.innerHTML=`<div class="done"><div style="font-size:55px">💗</div><h2>Thanks, ${esc(name.value)}!</h2><p>You got <b>${d.score}%</b> match.</p><div style="text-align:left;margin-top:25px">${d.review.map((x,i)=>`<div class="response"><b>Q${i+1}. ${esc(x.question)}</b><br><span>Your answer: ${esc(x.selected)}</span><br><span>Correct answer: <b>${esc(x.correct)}</b></span><br><span>${x.isCorrect?'✅ Correct':'❌ Incorrect'}</span></div>`).join('')}</div><p class="muted">Your answers have been recorded.</p></div>`;next.remove();};
function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"','&quot;')}
load();
</script></body></html>
