function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function render(){questions.innerHTML=qs.map((q,i)=>`<div class="q"><div class="qtop"><b>Question ${i+1}</b><button class="mini" onclick="removeQ(${i})">🗑️ Remove</button></div><label>Question<input value="${esc(q.text)}" oninput="qs[${i}].text=this.value"></label><div class="opts">${q.options.map((o,j)=>`<input value="${esc(o)}" oninput="qs[${i}].options[${j}]=this.value">`).join('')}</div><label>✅ Correct answer<select onchange="qs[${i}].correct=this.value===''?null:Number(this.value)"><option value="">Select correct answer</option>${q.options.map((o,j)=>`<option value="${j}" ${q.correct===j?'selected':''}>${String.fromCharCode(65+j)} — ${esc(o)}</option>`).join('')}</select></label></div>`).join('')}
function addQuestion(){qs.push({text:'💗 Your question?',options:['Option 1','Option 2','Option 3','Option 4','Option 5'],correct:null});render()}
function removeQ(i){if(qs.length>1){qs.splice(i,1);render()}}
async function createQuiz(){const missing=qs.findIndex(q=>q.correct===null);if(missing!==-1){alert('Please select the correct answer for Question '+(missing+1)+' before creating the link.');return}const body={owner_name:owner.value.trim(),title:title.value.trim(),questions:qs};const r=await fetch('/api/quizzes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)return alert(d.error||'Could not create quiz.');const base=location.origin,share=base+d.share_url,dash=base+'/dashboard/'+d.id;result.classList.remove('hidden');result.innerHTML=`<h3>🎉 Your quiz is live</h3><p><b>Share this link:</b></p><div class="copy">${share}</div><button class="btn pink" onclick="navigator.clipboard.writeText('${share}');this.textContent='Copied ✓'">Copy quiz link</button><a class="btn dark" href="${dash}">Open private dashboard →</a><p class="muted small">The quiz taker answers all questions and gets a score. Their name and every selected answer are saved to your dashboard.</p>`}
